<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Mass — Client Menu</title><style>
:root{--brand:#9c3425;--brand2:#f46926;--brandDark:#682116;--ink:#241714;--muted:#756964;--paper:#fffaf7;--line:#ead9d3;--ok:#2f7d5a;--danger:#a43a32}
*{box-sizing:border-box}body{margin:0;background:#f7f2ef;color:var(--ink);font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1450px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(135deg,var(--brandDark),var(--brand));color:white;border-radius:22px;padding:18px 22px;box-shadow:0 10px 30px #68211620}.brand{display:flex;align-items:center;gap:14px}.brand img{height:56px;max-width:220px;object-fit:contain}.brand h1{font-size:24px;margin:0}.brand small{opacity:.8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:white;color:var(--brandDark);padding:10px 15px;border-radius:12px}.tab.active{background:var(--brand);color:white;border-color:var(--brand)}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.75fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 18px #3a160b0b}.card h2{font-size:18px;margin:0 0 12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}.search{flex:1;min-width:220px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fffdfc}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--brand);color:#fff}.btn.alt{background:#f3e6e1;color:var(--brandDark)}.btn.dark{background:#2a211e}.btn.ok{background:var(--ok)}.btn.danger{background:var(--danger)}.btn.sm{padding:7px 9px;font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #f0e4e0;text-align:left;vertical-align:middle}.table th{background:#fff5f1;color:var(--brandDark);position:sticky;top:0}.rtl{text-align:right!important;direction:rtl}.price{width:130px;padding:8px;border:1px solid var(--line);border-radius:9px;text-align:right}.qty{width:82px;padding:8px;border:1px solid var(--line);border-radius:9px;text-align:center}.foodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.food{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fffdfc}.food .name{font-weight:750;min-height:42px}.food .cost{color:var(--muted);font-size:12px;margin:7px 0}.foodrow{display:flex;gap:8px;align-items:center}.summary{display:grid;gap:9px}.sumline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}.grand{font-size:22px;font-weight:800;color:var(--brand)}.shopping{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden}.shopping div{padding:9px;border-bottom:1px solid #f0e4e0}.shopping div:nth-child(4n+1),.shopping div:nth-child(4n+2){background:#fffaf7}.note{background:#fff5f1;border-left:4px solid var(--brand);padding:11px 13px;border-radius:9px;color:#553b35;font-size:13px}.modal{position:fixed;inset:0;background:#24171488;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{background:white;border-radius:18px;padding:20px;max-width:800px;width:100%;max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:10px}.empty{padding:30px;text-align:center;color:var(--muted)}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#f5e7e2;color:var(--brandDark);font-size:11px}.price-source{font-size:11px;color:var(--muted)}.footer{margin-top:20px;text-align:center;color:#8a7770;font-size:12px}.hidden{display:none!important}@media(max-width:950px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.brand img{height:44px}.app{padding:12px}}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.brand h1{font-size:18px}}

":2860000}],"settings":{"currency":"تومان"}};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state',{keyPath:'key'});if(!db.objectStoreNames.contains('public'))db.createObjectStore('public',{keyPath:'key'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getPublic(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('public','readonly');const req=tx.objectStore('public').get('menu');req.onsuccess=()=>res(req.result?.value||PUBLIC_INITIAL);req.onerror=()=>rej(req.error)})}
function money(n){return Math.round(Number(n)||0).toLocaleString('en-US')+' تومان'}
function escapeHtml(s){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function header(){return `<div class="top"><div class="brand"><img src="${LOGO}"><div><h1>The Mass</h1><small>Catering Menu</small></div></div></div>`}
function render(){document.getElementById('app').innerHTML=header()+`<div class="tabs"><button class="tab active">Menu</button><button class="tab" onclick="clearOrder()">Clear</button><button class="tab" onclick="window.print()">Print</button></div><div class="grid"><div class="card"><div class="toolbar"><input id="foodSearch" class="search" placeholder="Search menu..." oninput="filterFoods()"></div><div id="foodGrid" class="foodgrid">${state.foods.map((f,i)=>{const price=f.price,q=order[f.name]||0;return `<div class="food">${f.image?`<img class="food-image" src="${f.image}" alt="${escapeHtml(f.name)}">`:''}<div class="name">${escapeHtml(f.name)}</div>${f.subtitle?`<div class="subtitle">${escapeHtml(f.subtitle)}</div>`:''}<div class="cost">${money(price)} / unit</div><div class="foodrow"><input class="qty" type="number" min="0" step="1" value="${q}" onchange="setQty(${i},this.value)"></div></div>`}).join('')}</div></div><div class="card"><h2>Your Selection</h2><div id="summary"></div></div></div><div class="footer">The Mass Catering</div>`;renderSummary()}
function filterFoods(){const q=document.getElementById('foodSearch').value.toLowerCase();document.querySelectorAll('#foodGrid .food').forEach(x=>x.classList.toggle('hidden',!x.innerText.toLowerCase().includes(q)))}
function setQty(i,v){order[state.foods[i].name]=Math.max(0,Number(v)||0);renderSummary()}
function clearOrder(){order={};render()}
function renderSummary(){const rows=Object.entries(order).filter(([,q])=>q>0);let total=0;const html=rows.length?rows.map(([n,q])=>{const f=state.foods.find(x=>x.name===n),p=f.price;total+=p*q;return `<div class="sumline"><span><b>${escapeHtml(n)}</b>${f.subtitle?`<small class="subtitle">${escapeHtml(f.subtitle)}</small>`:''} × ${q}</span><b>${money(p*q)}</b></div>`}).join(''):'<div class="empty">Select items from the menu.</div>';document.getElementById('summary').innerHTML=html+`<div class="sumline"><span>Total</span><b class="grand">${money(total)}</b></div>`}
(async()=>{state=await getPublic();render()})();</script></body></html>
